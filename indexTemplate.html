<!DOCTYPE html>
<html>
<head>
	<title>Jai for highlight.js - {}</title>
	<script type="text/javascript" src="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
	<script type="text/javascript" src="../../dist/jai.min.js"></script>~
	<link id="$" disabled rel="stylesheet" type="text/css" href="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/styles/$.min.css"/>~
	<link id="jaiEverything" rel="stylesheet" type="text/css" href="../../dist/styles/jaiEverything.css"/>
	<style type="text/css">
		body,
		pre {
			display: grid;
			margin: 0;
			padding: 0;
			height: 100vh;
			font-weight: bold;
			font-size: 11px;
		}
		.menu {
			position: absolute;
			top: 0;
			right: 0;
			padding: 4px;
			background: rgba(42,42,42,0.42);
			border: 1px solid #333;
			border-radius: 3px;
			font-size: larger;
			& a {
				display: block;
				&#index {
					float: right;
				}
			}
			& span {
				background: #FFFFFF80;
			}
		}
	</style>
</head>
<body>
	<div class="menu">
		<a id="index" href="index.html">^index</a>
		<span>Theme:</span>
		<select id="theme">
			<option value="jaiEverything" selected>jaiEverything</option>
			<optgroup>%
				<option value="$">$</option>%
			</optgroup>
		</select>
		<a href="file:///*">*</a>
	</div>
	<pre><code class="language-jai">[]</code></pre>
	<script type="text/javascript">
		hljs.highlightAll();
		document.getElementById("theme").onchange = (e) => {
			[...document.getElementsByTagName("link")].forEach(el => { el.disabled = true; });
			document.getElementById(e.target.value).disabled = false;
		};
	</script>
</body>
</html>
