<!DOCTYPE html>
<html>
<head>
	<title>Jai for highlight.js</title>
	<script type="text/javascript" src="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
	<script type="text/javascript" src="../../dist/jai.min.js"></script>~
	<link id="$" disabled rel="stylesheet" type="text/css" href="../../../highlight.js/src/styles/$.css"/>~
	<link id="jaiEverything" rel="stylesheet" type="text/css" href="../../dist/styles/jaiEverything.css"/>
	<link rel="stylesheet" type="text/css" href="../../debug.css"/>
	<script type="text/javascript" src="../../debug.mjs"></script>
	<style type="text/css">
		.menu {
			position: fixed;
			top: 0;
			right: 16px;
			padding: 4px;
			background: rgba(42,42,42,0.42);
			border: 1px solid #333;
			border-radius: 3px;
			font-size: larger;
			& a {
				display: block;
				&#index {
					float: right;
				}
			}
			& span {
				background: #FFFFFF80;
			}
			& #stats {
				display: inline-flex;
				gap: 8px;
				margin: 0;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
				color: #FFF;

				& li {
					display: inline;
					list-style: none;
				}

				& .stale {
					color: #888;
				}
			}
		}

		.row {
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: 4px;
		}

		select {
			color: #FFF;
			background-color: #333;
		}

		#prev, #next {
			text-decoration: none;
			font-size: 1.5em;
			color: #FFF;

			&[href=""] {
				opacity: 0.5;
				pointer-events: none;
			}
		}

		#loading {
			display: none;
			position: fixed;
			inset: 0;
			place-items: center;
			pointer-events: none;
			background-color: #4448;
			z-index: 100;

			&::before {
				content: "";
				width: 28px;
				height: 28px;
				border: 4px solid #888;
				border-top-color: #FFF;
				border-radius: 999px;
				animation: loading-spin 0.7s linear infinite;
			}

			&.show {
				display: grid;
			}
		}

		@keyframes loading-spin {
			to {
				transform: rotate(360deg);
			}
		}

		::selection {
			color: #FF0;
			background-color: #0F0;
			text-shadow:
				2px		0		0		#F00,
				-2px	0		0		#F00,
				0		2px		0		#F00,
				0		-2px	0		#F00,
				1.4px	1.4px	0		#F00,
				-1.4px	1.4px	0		#F00,
				1.4px	-1.4px	0		#F00,
				-1.4px	-1.4px	0		#F00,
				0		0		6px		#F00,
				0		0		12px	#F00;
		}
	</style>
</head>
<body>
	<div id="loading" class="show"></div>
	<div class="menu">
		<span>Theme:</span>
		<select id="theme">
			<option value="jaiEverything" selected>jaiEverything</option>
			<optgroup label="Standard Themes">%
				<option value="$">$</option>%
			</optgroup>
		</select>
		<ul id="stats"></ul>
		<div class="row">
			<a id="prev" href="" title="Previous (p)">&#9664;</a>
			<select id="file">^
				<option value="$">*</option>^
			</select>
			<a id="next" href="" title="Next (n)">&#9654;</a>
		</div>
	</div>
	<pre><code id="code" class="language-jai"></code></pre>
	<script type="text/javascript">
		const fileSel = document.getElementById("file");
		let syncingHash = false;

		function highlight(codeEl) {
			hljs.highlightElement(codeEl);
		}

		function getFileFromHash() {
			const raw = window.location.hash.startsWith('#')
				? window.location.hash.slice(1)
				: '';
			return raw
				? decodeURIComponent(raw)
				: '';
		}

		function updateFileHash(file) {
			if (syncingHash) {
				return;
			}


			const nextHash = file
				? `#${encodeURIComponent(file)}`
				: '';
			if (window.location.hash !== nextHash) {
				history.replaceState(null, '', nextHash);	// Don't fire `onhashchange` event, since we already know the file is selected.
			}
		}

		function selectFileFromHash() {
			const file = getFileFromHash();
			if (!file) {
				return false;
			}


			const option = [...fileSel.options].find(opt => opt.value === file);
			if (!option) {
				return false;
			}


			syncingHash = true;
			fileSel.value = file;
			syncingHash = false;

			applyFile();
			return true;
		}

		setLoading = (isLoading) => {
			document.getElementById("loading").classList.toggle("show", isLoading);
		};

		function applyFile() {
			const file = fileSel.value;
			const prev = document.getElementById("prev");
			prev.href = fileSel.selectedIndex
				? fileSel.options[fileSel.selectedIndex - 1].value
				: "";
			const next = document.getElementById("next");
			next.href = fileSel.selectedIndex < fileSel.options.length - 1
				? fileSel.options[fileSel.selectedIndex + 1].value
				: "";

			document.title = `Jai for highlight.js - ${file}`;
			updateFileHash(file);
			setLoading(true);
			const codeEl = document.getElementById("code");
			codeEl.removeAttribute("data-highlighted");
			codeEl.textContent = "";

			fetch(file)
				.then(response => response.text())
				.then(
					text => requestAnimationFrame(
						() => setTimeout(
							() => {
								codeEl.textContent = text;
								try {
									highlight(codeEl);
								} finally {
									setLoading(false);
								}
							},
							0
						)
					)
				)
				.catch(error => {
					setLoading(false);
					alert(error);
				});
		}

		fileSel.onchange = applyFile;
		window.onhashchange = selectFileFromHash;

		const prev = document.getElementById("prev");
		prev.onclick = (e) => {
			e.preventDefault();
			if (e.target.href) {
				fileSel.selectedIndex--;
				applyFile();
			}
		};
		const next = document.getElementById("next")
		next.onclick = (e) => {
			e.preventDefault();
			if (e.target.href) {
				fileSel.selectedIndex++;
				applyFile();
			}
		};

		document.getElementById("theme").onchange = (e) => {
			[...document.getElementsByTagName("link")]
				.forEach(el => { el.disabled = true; });
			document.getElementById(e.target.value).disabled = false;
		};

		hljs.registerLanguage('jai', jai);
		// first:
		if (!selectFileFromHash()) {
			applyFile();
		}

		document.body.onkeypress = (e) => {
			if (e.key === 'n') {
				next.click();
			} else if (e.key === 'p') {
				prev.click();
			}
		};
	</script>
</body>
</html>
